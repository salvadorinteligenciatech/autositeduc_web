<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />

  <title>Confirmar pagamento | AutoSITEduc</title>

  <meta
    name="description"
    content="Confirmação administrativa de pagamento do AutoSITEduc."
  />

  <meta name="robots" content="noindex, nofollow, noarchive" />

  <link
    rel="icon"
    href="../assets/favicon.svg"
    type="image/svg+xml"
  />

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #163052 0, transparent 42%),
        #07111f;
      color: #f5f7fb;
    }

    main {
      width: min(100%, 560px);
      padding: 32px;
      background: rgba(12, 29, 50, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
    }

    .logo-wrapper {
      text-align: center;
    }

    .logo {
      max-width: 190px;
      height: auto;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    p {
      color: #cbd6e5;
      line-height: 1.6;
    }

    .status {
      margin: 0;
      text-align: center;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 28px auto;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: #6eb7ff;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    .details {
      display: none;
      margin-top: 24px;
    }

    .details.is-visible {
      display: block;
    }

    .customer-data {
      margin: 22px 0;
      padding: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      line-height: 1.8;
    }

    .customer-data strong {
      color: #fff;
    }

    .warning {
      padding: 13px 15px;
      background: rgba(255, 193, 7, 0.13);
      border: 1px solid rgba(255, 193, 7, 0.35);
      border-radius: 9px;
      color: #ffe7a3;
    }

    .button {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: #70bdff;
      color: #07111f;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .button:hover {
      filter: brightness(1.06);
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .error {
      color: #ffd6d6;
    }

    .success {
      color: #9ce8bd;
    }

    .success-panel {
      display: none;
      margin-top: 22px;
      text-align: center;
    }

    .success-panel.is-visible {
      display: block;
    }

    .success-icon {
      margin-bottom: 10px;
      color: #58d68d;
      font-size: 54px;
      line-height: 1;
    }

    .technical-note {
      margin-top: 20px;
      color: #93a6bd;
      font-size: 0.82rem;
      text-align: center;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo-wrapper">
      <img
        class="logo"
        src="../assets/logo-autositeduc.png"
        alt="AutoSITEduc"
      />
    </div>

    <h1 id="title">Confirmar pagamento</h1>

    <p class="status" id="status" aria-live="polite">
      Carregando os dados da solicitação...
    </p>

    <div class="loader" id="loader" aria-hidden="true"></div>

    <section class="details" id="details">
      <div class="customer-data">
        <strong>Cliente:</strong>
        <span id="customer-name"></span>
        <br />

        <strong>E-mail:</strong>
        <span id="customer-email"></span>
        <br />

        <strong>Plano:</strong>
        <span id="customer-plan"></span>
        <br />

        <strong>Modalidade:</strong>
        <span id="customer-modality"></span>
        <br />

        <strong>Valor:</strong>
        <span id="customer-value"></span>
      </div>

      <p class="warning">
        Confirme somente após verificar o comprovante do PIX.
      </p>

      <button class="button" id="confirm-button" type="button">
        Confirmar e liberar acesso
      </button>
    </section>

    <section class="success-panel" id="success-panel">
      <div class="success-icon" aria-hidden="true">✓</div>

      <h2>Pagamento confirmado</h2>

      <p>
        O acesso foi liberado e o e-mail de boas-vindas foi enviado.
      </p>

      <p class="technical-note">
        Esta página já pode ser fechada.
      </p>
    </section>

  </main>

  <script>
    (() => {
      "use strict";

      const PUBLIC_WEB_APP_URL =
        "https://script.google.com/macros/s/"
        + "AKfycbzj-u-xc7PQuW1xqw35S5HfOnyrjJ79xbZoBA_rTdckVNKLZv8hfI8OSUvJvY0huHcK"
        + "/exec";

      const API_SOURCE = "autositeduc_payment_api";
      const MAX_STATUS_ATTEMPTS = 20;
      const STATUS_INTERVAL_MS = 1500;

      const sourceParams =
        new URLSearchParams(window.location.search);

      const action =
        (sourceParams.get("action") || "").trim();

      const submissionId =
        (sourceParams.get("submission_id") || "").trim();

      const signature =
        (sourceParams.get("signature") || "").trim();

      const titleElement =
        document.getElementById("title");

      const statusElement =
        document.getElementById("status");

      const loaderElement =
        document.getElementById("loader");

      const detailsElement =
        document.getElementById("details");

      const successPanelElement =
        document.getElementById("success-panel");

      const confirmButton =
        document.getElementById("confirm-button");

      let customerData = null;
      let statusAttempts = 0;

      function setError(message) {
        loaderElement.hidden = true;
        detailsElement.classList.remove("is-visible");
        successPanelElement.classList.remove("is-visible");

        statusElement.textContent = message;
        statusElement.classList.remove("success");
        statusElement.classList.add("error");

        confirmButton.disabled = false;
      }

      function setLoading(message) {
        statusElement.textContent = message;
        statusElement.classList.remove("error", "success");
        loaderElement.hidden = false;
      }

      function setSuccess() {
        loaderElement.hidden = true;
        detailsElement.classList.remove("is-visible");

        titleElement.textContent = "Pagamento confirmado";

        statusElement.textContent =
          "Operação concluída com sucesso.";

        statusElement.classList.remove("error");
        statusElement.classList.add("success");

        successPanelElement.classList.add("is-visible");
      }

      function fillCustomerData(data) {
        document.getElementById("customer-name").textContent =
          data.name || "—";

        document.getElementById("customer-email").textContent =
          data.email || "—";

        document.getElementById("customer-plan").textContent =
          data.commercialName || "—";

        document.getElementById("customer-modality").textContent =
          data.modality || "—";

        document.getElementById("customer-value").textContent =
          data.formattedValue || "—";
      }

      async function requestPaymentData(onComplete) {
        try {
          const requestUrl = new URL(PUBLIC_WEB_APP_URL);

          requestUrl.searchParams.set("api", "payment");
          requestUrl.searchParams.set(
            "action",
            "confirm_payment",
          );
          requestUrl.searchParams.set(
            "submission_id",
            submissionId,
          );
          requestUrl.searchParams.set(
            "signature",
            signature,
          );
          requestUrl.searchParams.set(
            "_",
            String(Date.now()),
          );

          const response = await fetch(
            requestUrl.toString(),
            {
              method: "GET",
              mode: "cors",
              credentials: "omit",
              cache: "no-store",
            },
          );

          if (!response.ok) {
            throw new Error(
              `Falha na consulta: HTTP ${response.status}.`,
            );
          }

          const payload = await response.json();

          if (
            !payload
            || payload.source !== API_SOURCE
          ) {
            throw new Error(
              "A resposta recebida é inválida.",
            );
          }

          if (!payload.ok) {
            throw new Error(
              payload.error
              || "A operação não pôde ser concluída.",
            );
          }

          onComplete(null, payload.data || {});
        } catch (error) {
          onComplete(
            new Error(
              error && error.message
                ? error.message
                : "Não foi possível acessar o serviço de confirmação.",
            ),
          );
        }
      }

      function showReview(data) {
        customerData = data;

        if (
          data.paymentStatus === "confirmado"
          && data.welcomeStatus === "enviada"
        ) {
          setSuccess();
          return;
        }

        fillCustomerData(data);

        if (!data.executeSignature) {
          setError(
            "Não foi possível preparar a autorização da confirmação.",
          );
          return;
        }

        loaderElement.hidden = true;

        statusElement.textContent =
          "Revise os dados antes de liberar o acesso.";

        detailsElement.classList.add("is-visible");
      }

      function pollConfirmationStatus() {
        requestPaymentData((error, data) => {
          if (error) {
            setError(error.message);
            return;
          }

          if (
            data.paymentStatus === "confirmado"
            && data.welcomeStatus === "enviada"
          ) {
            setSuccess();
            return;
          }

          statusAttempts += 1;

          if (statusAttempts >= MAX_STATUS_ATTEMPTS) {
            setError(
              "A confirmação foi enviada, mas o resultado ainda não foi identificado. Recarregue esta página para consultar novamente.",
            );
            return;
          }

          window.setTimeout(
            pollConfirmationStatus,
            STATUS_INTERVAL_MS,
          );
        });
      }

      function executePaymentConfirmation() {
        if (
          !customerData
          || !customerData.executeSignature
        ) {
          setError(
            "Os dados da confirmação não estão disponíveis.",
          );
          return;
        }

        confirmButton.disabled = true;

        detailsElement.classList.remove("is-visible");

        setLoading(
          "Confirmando o pagamento e liberando o acesso...",
        );

        const requestBody = new URLSearchParams();

        requestBody.set("api", "payment");
        requestBody.set(
          "action",
          "execute_payment_confirmation",
        );
        requestBody.set(
          "submission_id",
          submissionId,
        );
        requestBody.set(
          "signature",
          customerData.executeSignature,
        );

        fetch(
          PUBLIC_WEB_APP_URL,
          {
            method: "POST",
            mode: "no-cors",
            credentials: "omit",
            cache: "no-store",
            headers: {
              "Content-Type":
                "application/x-www-form-urlencoded;charset=UTF-8",
            },
            body: requestBody.toString(),
          },
        ).catch(() => {
          // A resposta é opaca em no-cors.
          // O resultado real é verificado por polling JSONP.
        });

        statusAttempts = 0;

        window.setTimeout(
          pollConfirmationStatus,
          STATUS_INTERVAL_MS,
        );
      }

      if (
        action !== "confirm_payment"
        || !submissionId
        || !signature
      ) {
        setError(
          "Este link de confirmação está incompleto ou é inválido.",
        );
        return;
      }

      confirmButton.addEventListener(
        "click",
        executePaymentConfirmation,
      );

      requestPaymentData((error, data) => {
        if (error) {
          setError(error.message);
          return;
        }

        showReview(data);
      });
    })();
  </script>
</body>

</html>
