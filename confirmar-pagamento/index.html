<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07111f" />

  <title>Confirmar pagamento | AutoSITEduc</title>

  <meta
    name="description"
    content="Redirecionamento seguro para a confirmação administrativa de pagamento do AutoSITEduc."
  />

  <meta name="robots" content="noindex, nofollow, noarchive" />

  <link
    rel="icon"
    href="../assets/favicon.svg"
    type="image/svg+xml"
  />

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #163052 0, transparent 42%),
        #07111f;
      color: #f5f7fb;
    }

    main {
      width: min(100%, 520px);
      padding: 32px;
      text-align: center;
      background: rgba(12, 29, 50, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
    }

    .logo {
      max-width: 190px;
      height: auto;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.6rem, 5vw, 2.2rem);
    }

    p {
      margin: 0;
      color: #cbd6e5;
      line-height: 1.6;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 28px auto;
      border: 4px solid rgba(255, 255, 255, 0.18);
      border-top-color: #6eb7ff;
      border-radius: 50%;
      animation: girar 0.8s linear infinite;
    }

    .fallback {
      display: none;
      margin-top: 24px;
    }

    .fallback.is-visible {
      display: block;
    }

    .button {
      display: inline-block;
      margin-top: 14px;
      padding: 13px 20px;
      color: #07111f;
      background: #70bdff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
    }

    .error {
      color: #ffd6d6;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="../assets/logo-autositeduc.png"
      alt="AutoSITEduc"
    />

    <h1>Preparando a confirmação</h1>

    <p id="status">
      Aguarde enquanto abrimos a página segura de confirmação do pagamento.
    </p>

    <div class="loader" id="loader" aria-hidden="true"></div>

    <div class="fallback" id="fallback">
      <p>
        O redirecionamento não ocorreu automaticamente.
      </p>

      <a class="button" id="continue-link" href="#">
        Continuar para a confirmação
      </a>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const PUBLIC_WEB_APP_URL =
        "https://script.google.com/macros/s/"
        + "AKfycbzj-u-xc7PQuW1xqw35S5HfOnyrjJ79xbZoBA_rTdckVNKLZv8hfI8OSUvJvY0huHcK"
        + "/exec";

      const allowedActions = new Set([
        "confirm_payment",
        "execute_payment_confirmation",
      ]);

      const sourceParams = new URLSearchParams(window.location.search);

      const action = (sourceParams.get("action") || "").trim();
      const submissionId =
        (sourceParams.get("submission_id") || "").trim();
      const signature =
        (sourceParams.get("signature") || "").trim();

      const statusElement = document.getElementById("status");
      const loaderElement = document.getElementById("loader");
      const fallbackElement = document.getElementById("fallback");
      const continueLink = document.getElementById("continue-link");

      if (
        !allowedActions.has(action)
        || !submissionId
        || !signature
      ) {
        statusElement.textContent =
          "Este link de confirmação está incompleto ou é inválido.";
        statusElement.classList.add("error");
        loaderElement.hidden = true;
        return;
      }

      const destination = new URL(PUBLIC_WEB_APP_URL);

      destination.searchParams.set("action", action);
      destination.searchParams.set(
        "submission_id",
        submissionId,
      );
      destination.searchParams.set(
        "signature",
        signature,
      );

      const destinationUrl = destination.toString();

      continueLink.href = destinationUrl;

      window.setTimeout(() => {
        fallbackElement.classList.add("is-visible");
      }, 2500);

      window.location.replace(destinationUrl);
    })();
  </script>
</body>

</html>
